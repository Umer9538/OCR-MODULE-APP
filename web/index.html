  <meta name="description" content="Health Record OCR Module is a standalone Flutter feature designed to allow users to upload health record images and automatically extract text using on-device OCR. The module uses an email address as a lightweight identifier (no authentication required) to store and retrieve previously uploaded records.  Users can capture an image using the device camera or select one from the gallery. The image is securely uploaded to Firebase Storage, while the extracted text and related metadata (timestamp, image URL, email) are stored in Firebase Firestore. Previously uploaded records can be retrieved by entering the same email address.  This module is built with clean architecture and clear separation between UI, services, and Firebase logic, making it easy to integrate into an existing Flutter application by simply replacing Firebase configuration files.  The feature is intended as a paid assessment task to evaluate Flutter, Firebase, OCR implementation, code quality, and UX logic, with the goal of extending into long-term collaboration if successful.">
